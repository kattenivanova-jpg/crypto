.o1{left:calc(var(--u)*-170);top:calc(var(--u)*190);width:calc(var(--u)*760);aspect-ratio:1584/1230;transform:rotate(-10deg)}
.logo,.nav,.lang,.cta{position:absolute}
.logo{left:calc(var(--u)*27);top:calc(var(--u)*28);height:calc(var(--u)*34);line-height:0}
.logo img{height:100%;display:block}
.nav{left:calc(var(--u)*281);top:calc(var(--u)*45);transform:translateY(-50%);display:flex;gap:calc(var(--u)*14);font-size:calc(var(--u)*11);letter-spacing:calc(var(--u)*.4);text-transform:uppercase;font-weight:400;white-space:nowrap}
.lang{left:calc(var(--u)*822);top:calc(var(--u)*45);transform:translateY(-50%);font-family:'Space Mono',monospace;font-size:calc(var(--u)*10);letter-spacing:calc(var(--u)*.5)}
.cta{left:calc(var(--u)*938);top:calc(var(--u)*24);height:calc(var(--u)*42);line-height:0;cursor:pointer}
.cta img{height:100%;display:block}
.card{position:absolute;top:calc(var(--u)*143);width:calc(var(--u)*268);height:calc(var(--u)*402);border-radius:calc(var(--u)*12);border:1px solid rgba(255,255,255,.22);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));backdrop-filter:blur(calc(var(--u)*12)) saturate(1.1);-webkit-backdrop-filter:blur(calc(var(--u)*12)) saturate(1.1);cursor:pointer;transition:border-color .4s}
.card:hover{border-color:rgba(255,255,255,.5)}
.c1{left:calc(var(--u)*157)}.c2{left:calc(var(--u)*438)}.c3{left:calc(var(--u)*719)}

.card h3{position:absolute;left:0;right:0;top:calc(var(--u)*241);padding:0 calc(var(--u)*30);text-align:center;text-transform:uppercase;font-weight:400;font-size:calc(var(--u)*15.5);line-height:calc(var(--u)*16);letter-spacing:calc(var(--u)*.2)}
.plus{position:absolute;left:50%;top:calc(var(--u)*346);width:calc(var(--u)*13);height:calc(var(--u)*13);transform:translate(-50%,-50%);transition:transform .4s}
.plus::before,.plus::after{content:"";position:absolute;background:#fff}
.plus::before{left:0;right:0;top:50%;height:1.2px;margin-top:-.6px}
.plus::after{top:0;bottom:0;left:50%;width:1.2px;margin-left:-.6px}
.card:hover .plus{transform:translate(-50%,-50%) rotate(90deg)}
@media (max-aspect-ratio:1/1){
 :root{--u:calc(100vw/400)}
 .stage{height:calc(var(--u)*1500)}
 .nav,.lang{display:none}
 .logo{left:calc(var(--u)*16)}.cta{left:auto;right:calc(var(--u)*16)}
 .card{left:50% !important;transform:translateX(-50%)}
 .c1{top:calc(var(--u)*100)}.c2{top:calc(var(--u)*520)}.c3{top:calc(var(--u)*940)}
 .coin{left:calc(var(--u)*220);width:calc(var(--u)*300);opacity:.6}
 .o1{top:calc(var(--u)*500)}
}
